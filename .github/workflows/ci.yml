name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sockets
          coverage: none

      - name: Unit tests
        run: go test ./internal/... ./cmd/...

      - name: Integration tests
        run: go test ./tests/integration/...

      - name: Race
        run: CGO_ENABLED=1 go test -race ./internal/...

      - name: Version contract
        run: |
          go build -ldflags "-X main.Version=$(cat VERSION)" -o /tmp/eregion ./cmd/eregion
          /tmp/eregion version
          /tmp/eregion --version
          /tmp/eregion version | grep -E '^eregion '
          /tmp/eregion version | grep -E '^protocol eregion/1$'
