name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Race
        run: CGO_ENABLED=1 go test -race ./...

      - name: Version contract
        run: |
          go build -ldflags "-X main.Version=$(cat VERSION)" -o /tmp/eregion ./cmd/eregion
          /tmp/eregion version
          /tmp/eregion --version
          /tmp/eregion version | grep -E '^eregion '
          /tmp/eregion version | grep -E '^protocol eregion/1$'
